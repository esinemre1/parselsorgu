<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parsel Sorgulama</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<style>
:root{--primary:#1e40af;--primary-hover:#1e3a8a;--bg:#f8fafc;--border:#cbd5e1;--text:#0f172a;--muted:#64748b;--sidebar:340px}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,sans-serif;color:var(--text);background:var(--bg)}body{display:flex;flex-direction:column;overflow:hidden}
header{height:56px;background:var(--primary);color:white;display:flex;align-items:center;padding:0 16px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.12);z-index:1001}.logo{display:flex;gap:10px;align-items:center}.logo b{width:28px;height:28px;border-radius:4px;background:white;color:var(--primary);display:grid;place-items:center}
main{display:flex;flex:1;min-height:0;position:relative}.sidebar{width:var(--sidebar);min-width:var(--sidebar);background:white;border-right:1px solid var(--border);padding:16px;overflow:auto;z-index:1000;transition:.25s}.sidebar.collapsed{transform:translateX(-100%);position:absolute;top:0;bottom:0}.toggle{position:absolute;left:10px;top:10px;z-index:1002;width:36px;height:36px;border:1px solid var(--border);background:white;border-radius:4px;cursor:pointer}.section{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.06em;border-bottom:1px solid var(--border);padding-bottom:4px;margin:2px 0 10px}.group{margin-bottom:10px}.group label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}.group select,.group input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:4px;background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;padding:10px;border:0;border-radius:4px;background:var(--primary);color:white;font-weight:600;cursor:pointer}.btn:hover{background:var(--primary-hover)}.btn:disabled{background:#94a3b8;cursor:not-allowed}.btn.green{background:#059669}.result{display:none;margin-top:12px;border:1px solid var(--border);border-radius:4px;background:#f8fafc}.result h3{font-size:12px;margin:0;padding:8px 10px;background:#f1f5f9;border-bottom:1px solid var(--border)}.row{display:flex;justify-content:space-between;padding:7px 10px;border-bottom:1px solid #e5e7eb;font-size:13px}.row:last-child{border-bottom:0}.muted{color:var(--muted)}#map{flex:1;min-width:0;background:#e5e7eb}.branding{position:fixed;right:8px;bottom:8px;z-index:2001;background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:3px;padding:3px 6px;font-size:10px;font-weight:700;color:var(--primary)}#status{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1e293b;color:white;padding:10px 16px;border-radius:8px;display:none;z-index:3000;font-size:13px}.note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.45}
@media(max-width:760px){.sidebar{position:absolute;top:0;bottom:0;left:0;box-shadow:4px 0 16px rgba(0,0,0,.12)}.sidebar.collapsed{display:none}}
</style>
</head>
<body>
<header><div class="logo"><b>T</b><span>PARSEL SORGULAMA</span></div></header>
<main>
<button class="toggle" id="menuToggle">☰</button>
<aside class="sidebar" id="sidebar">
<div class="section">İdari Birim</div>
<div class="group"><label>İl</label><select id="il"><option value="">Yükleniyor...</option></select></div>
<div class="group"><label>İlçe</label><select id="ilce" disabled><option value="">-</option></select></div>
<div class="group"><label>Mahalle</label><select id="mahalle" disabled><option value="">-</option></select></div>
<div class="section">Taşınmaz</div>
<div class="grid"><div class="group"><label>Ada</label><input id="ada" type="number" placeholder="Ada"></div><div class="group"><label>Parsel</label><input id="parsel" type="number" placeholder="Parsel"></div></div>
<button class="btn" id="queryBtn">Sorgula</button>
<div class="result" id="result"><h3>BİLGİLER</h3><div class="row"><span class="muted">Alan</span><strong id="resAlan">-</strong></div><div class="row"><span class="muted">Konum</span><strong id="resKonum">-</strong></div><div style="padding:10px"><button class="btn green" id="dxfBtn">DXF İndir</button></div></div>
<div class="note">Not: Bu sürüm tarayıcıda doğrudan TKGM CBS API'sine erişmeyi dener. Tarayıcı CORS politikası erişimi engellerse statik GitHub Pages üzerinde sorgu çalışmayabilir; bu durumda küçük bir sunucu/proxy katmanı gerekir.</div>
</aside>
<div id="map"></div><div class="branding">E.EMRE KIRIK</div>
</main>
<div id="status"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BASE='https://cbsapi.tkgm.gov.tr/megsiswebapi.v3/api';
const API={iller:`${BASE}/idariYapi/ilListe`,ilceler:id=>`${BASE}/idariYapi/ilceListe/${id}`,mahalleler:id=>`${BASE}/idariYapi/mahalleListe/${id}`,parsel:(m,a,p)=>`${BASE}/parsel/${m}/${a}/${p}`};
const $=id=>document.getElementById(id);const ui={il:$('il'),ilce:$('ilce'),mahalle:$('mahalle'),ada:$('ada'),parsel:$('parsel'),query:$('queryBtn'),result:$('result'),status:$('status'),dxf:$('dxfBtn')};
const googleHybrid=L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}',{maxZoom:20,subdomains:['mt0','mt1','mt2','mt3']});
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'});
const map=L.map('map',{zoomControl:false,layers:[googleHybrid]}).setView([39,35],6);L.control.zoom({position:'bottomright'}).addTo(map);L.control.layers({'Google Hybrid':googleHybrid,'OpenStreetMap':osm},{}).addTo(map);let geoLayer=null,currentParcelData=null;
function showStatus(msg){ui.status.textContent=msg;ui.status.style.display='block';clearTimeout(window._st);window._st=setTimeout(()=>ui.status.style.display='none',3500)}
async function smartFetch(url){ui.query.disabled=true;try{const r=await fetch(url,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){console.error(e);showStatus('Veri alınamadı. Tarayıcı CORS engeli olabilir.');return null}finally{ui.query.disabled=false}}
async function loadOptions(url,target,label){target.disabled=true;const d=await smartFetch(url);target.innerHTML=`<option value="">${label} Seç...</option>`;if(d?.features){d.features.sort((a,b)=>String(a.properties.text).localeCompare(String(b.properties.text),'tr')).forEach(f=>{const o=document.createElement('option');o.value=f.properties.id;o.textContent=f.properties.text;target.appendChild(o)});target.disabled=false}}
ui.il.onchange=()=>{ui.ilce.innerHTML='<option value="">-</option>';ui.mahalle.innerHTML='<option value="">-</option>';ui.mahalle.disabled=true;if(ui.il.value)loadOptions(API.ilceler(ui.il.value),ui.ilce,'İlçe')};
ui.ilce.onchange=()=>{ui.mahalle.innerHTML='<option value="">-</option>';if(ui.ilce.value)loadOptions(API.mahalleler(ui.ilce.value),ui.mahalle,'Mahalle')};
ui.query.onclick=async()=>{const m=ui.mahalle.value,a=ui.ada.value,p=ui.parsel.value;if(!m||!a||!p)return showStatus('Tüm alanları doldurun.');const d=await smartFetch(API.parsel(m,a,p));if(!d)return;const f=d.type==='Feature'?d:d.features?.[0];if(!f)return showStatus('Parsel bulunamadı.');$('resAlan').textContent=(f.properties?.alan??'-')+' m²';$('resKonum').textContent=`${f.properties?.ilAd??''}/${f.properties?.ilceAd??''}`;ui.result.style.display='block';if(geoLayer)map.removeLayer(geoLayer);geoLayer=L.geoJSON(d,{style:{color:'#2563eb',weight:3,fillOpacity:.12}}).addTo(map);map.fitBounds(geoLayer.getBounds(),{padding:[40,40]});currentParcelData=d};
ui.dxf.onclick=()=>{if(!currentParcelData)return;let coords=currentParcelData.type==='Feature'?currentParcelData.geometry.coordinates:currentParcelData.features[0].geometry.coordinates;let ring=coords;while(Array.isArray(ring[0])&&typeof ring[0][0]!=='number')ring=ring[0];const avgLon=ring.reduce((s,p)=>s+p[0],0)/ring.length;const zones=[27,30,33,36,39,42,45];const cm=zones.reduce((a,b)=>Math.abs(b-avgLon)<Math.abs(a-avgLon)?b:a);const projStr=`+proj=tmerc +lat_0=0 +lon_0=${cm} +k=1 +x_0=500000 +y_0=0 +ellps=GRS80 +units=m +no_defs`;const LB='\r\n';let dxf='  0'+LB+'SECTION'+LB+'  2'+LB+'HEADER'+LB+'  9'+LB+'$ACADVER'+LB+'  1'+LB+'AC1009'+LB+'  0'+LB+'ENDSEC'+LB;dxf+='  0'+LB+'SECTION'+LB+'  2'+LB+'TABLES'+LB+'  0'+LB+'TABLE'+LB+'  2'+LB+'LAYER'+LB+' 70'+LB+'1'+LB+'  0'+LB+'LAYER'+LB+'  2'+LB+'PARSEL_SINIRI'+LB+' 70'+LB+'64'+LB+' 62'+LB+'7'+LB+'  6'+LB+'CONTINUOUS'+LB+'  0'+LB+'ENDTAB'+LB+'  0'+LB+'ENDSEC'+LB;dxf+='  0'+LB+'SECTION'+LB+'  2'+LB+'ENTITIES'+LB+'  0'+LB+'POLYLINE'+LB+'  8'+LB+'PARSEL_SINIRI'+LB+' 66'+LB+'1'+LB+' 70'+LB+'1'+LB+' 10'+LB+'0.0'+LB+' 20'+LB+'0.0'+LB+' 30'+LB+'0.0'+LB;ring.forEach(p=>{const pr=proj4('EPSG:4326',projStr,[p[0],p[1]]);dxf+='  0'+LB+'VERTEX'+LB+'  8'+LB+'PARSEL_SINIRI'+LB+' 10'+LB+pr[0].toFixed(3)+LB+' 20'+LB+pr[1].toFixed(3)+LB+' 30'+LB+'0.0'+LB});dxf+='  0'+LB+'SEQEND'+LB+'  8'+LB+'PARSEL_SINIRI'+LB+'  0'+LB+'ENDSEC'+LB+'  0'+LB+'EOF'+LB;const b=new Blob([dxf],{type:'application/dxf'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`${ui.ada.value}_${ui.parsel.value}_itrf${cm}.dxf`;a.click();URL.revokeObjectURL(u);showStatus('DXF indirildi.')};
$('menuToggle').onclick=()=>{$('sidebar').classList.toggle('collapsed');setTimeout(()=>map.invalidateSize(),280)};
loadOptions(API.iller,ui.il,'İl');
</script>
</body>
</html>
